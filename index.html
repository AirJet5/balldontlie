<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BALLDONTLIE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky scoreboard bar with the league badge + tab rail; one content column (max 1200px) of panels; tables scroll inside their own frames. */
:root{
  --paper:#F2F4F9; --card:#FFFFFF; --ink:#0D1A33; --muted:#5A6580; --line:#D8DDE9; --soft:#E8ECF5;
  --blue:#264A98; --blue-2:#3B67C8; --blue-ink:#FFFFFF; --gold:#B7821F; --gold-soft:#F6EBD3;
  --good:#1F8A4C; --bad:#C23B3B; --teamopt:#2F6FD6; --playeropt:#1F8A4C;
  --f-display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#091124; --card:#101A31; --ink:#E6EBF6; --muted:#8F9BB8; --line:#22304F; --soft:#17233F;
  --blue:#7C9EF2; --blue-2:#9AB5F7; --blue-ink:#091124; --gold:#E2B25A; --gold-soft:#3A2F17;
  --good:#4CC27F; --bad:#F07474; --teamopt:#7FA7FF; --playeropt:#5FD08F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#091124; --card:#101A31; --ink:#E6EBF6; --muted:#8F9BB8; --line:#22304F; --soft:#17233F;
  --blue:#7C9EF2; --blue-2:#9AB5F7; --blue-ink:#091124; --gold:#E2B25A; --gold-soft:#3A2F17;
  --good:#4CC27F; --bad:#F07474; --teamopt:#7FA7FF; --playeropt:#5FD08F; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.view>*,.panel>*,.grid2>*,.grid3>*,.fin>*,.kpis>*{min-width:0}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.5 var(--f-body);margin:0}
a{color:var(--blue)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:.86em}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1200px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:18px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.mark{display:block;width:30px;aspect-ratio:220/308;background:var(--blue);-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.brand b{font:900 22px/1 var(--f-display);letter-spacing:.04em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer}
.tabs button:hover{color:var(--ink);background:var(--soft)}
.tabs button[aria-selected="true"]{background:var(--blue);color:var(--blue-ink)}
@media (max-width:640px){.brand b{display:none}.bar-in{gap:10px}}

main{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
section.view{display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1}
h2{font-size:clamp(28px,4vw,40px);font-weight:900;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:20px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);max-width:65ch;margin:6px 0 0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel>h3{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;align-items:start}
.note{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--soft);padding:4px;border-radius:999px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
select,input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* team tag */
.tm{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--f-mono);letter-spacing:.02em;white-space:nowrap}
.tm::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tm.big{font-size:15px}
button.tm{border:0;background:none;padding:0;cursor:pointer;color:inherit}
button.tm:hover{text-decoration:underline}

/* tables */
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
th.n,td.n{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[data-dir]::after{content:" ↓"}
th.sort[data-dir="asc"]::after{content:" ↑"}
.dim{color:var(--muted)}
.pos{display:inline-block;min-width:28px;font:600 11px/1 var(--f-mono);padding:4px 5px;border-radius:4px;background:var(--soft);text-align:center}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;padding-block:8px}
.hero .mark{width:clamp(96px,14vw,150px)}
.hero h1{font-size:clamp(48px,9vw,104px);font-weight:900;letter-spacing:.02em;line-height:.88}
.hero p{margin:10px 0 0;color:var(--muted);font-size:17px;max-width:52ch}
.hero p.tag{font:700 clamp(18px,2.4vw,24px)/1.2 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--blue)}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:14px}}
.tip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tip>div{background:var(--card);padding:16px 18px;display:grid;gap:4px;align-content:start}
.tip .v{font:800 34px/1 var(--f-display);letter-spacing:.01em}
.tip .v small{font-size:18px;color:var(--muted)}
.champ{background:var(--blue);color:var(--blue-ink);border-radius:var(--r);padding:22px;display:grid;gap:8px;position:relative;overflow:hidden}
.champ .eyebrow{color:inherit;opacity:.8}
.champ .v{font:900 clamp(40px,6vw,64px)/.9 var(--f-display);text-transform:uppercase}
.champ .mark{position:absolute;right:-18px;bottom:-30px;width:150px;background:var(--blue-ink);opacity:.12}
.conf{display:grid;gap:14px}
.divs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.div h4{margin:0 0 8px;font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tcard{display:grid;grid-template-columns:1fr auto;gap:2px 8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
.tcard:hover{border-color:var(--blue)}
.tcard .nm{font-weight:600;font-size:14px;grid-column:1/-1}
.tcard .mg{font-size:12px;color:var(--muted)}
.tcard .py{font:500 12px/1 var(--f-mono);color:var(--muted);text-align:right}
.meter{grid-column:1/-1;height:4px;border-radius:2px;background:var(--soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--blue)}
.meter i.over{background:var(--bad)}
.rank{display:grid;gap:6px}
.rank .r{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center}
.rank .b{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.rank .b i{display:block;height:100%;background:var(--gold)}
.rank .b i.s{background:var(--blue)}

/* palmarès */
.finals{display:grid;gap:0}
.fin{display:grid;grid-template-columns:110px 1fr 1fr 80px;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--soft)}
.fin .yr{font:800 26px/1 var(--f-display)}
.fin .w{display:grid;gap:3px}
.fin .w .tm{font-size:16px}
.fin .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trophy{color:var(--gold)}
.fin.pending .yr{color:var(--muted)}
@media (max-width:560px){.fin{grid-template-columns:80px 1fr 1fr}.fin .cap{display:none}}
.heat td.h{text-align:center;font:500 12px/1 var(--f-mono);padding:7px 4px;min-width:44px}
.heat td.h span{display:inline-block;min-width:30px;padding:5px 0;border-radius:4px}
.heat td.h span.ch{outline:2px solid var(--gold);outline-offset:-2px;font-weight:700}
.bracket{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:10px;align-items:center;min-width:900px}
.rd{display:grid;gap:10px}
.rd .t{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:center}
.mu{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.mu div{display:grid;grid-template-columns:20px 1fr auto;gap:6px;align-items:center;padding:6px 8px;font-size:13px}
.mu div+div{border-top:1px solid var(--soft)}
.mu .sd{font:500 11px/1 var(--f-mono);color:var(--muted)}
.mu .sc{font:700 14px/1 var(--f-mono)}
.mu .win{background:var(--soft)}
.mu .win .sc{color:var(--blue)}
.mu.final{border-color:var(--gold)}
.mu.final .win .sc{color:var(--gold)}
.prose{max-width:68ch;display:grid;gap:12px}
.prose p{margin:0}

/* plantilles */
.thead{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.thead h2{display:flex;align-items:center;gap:12px}
.swatch{width:14px;height:44px;border-radius:3px;background:var(--c)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.kpi .v{font:800 26px/1 var(--f-display)}
.kpi .v.good{color:var(--good)}.kpi .v.bad{color:var(--bad)}
.sal{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.sal.b{color:var(--teamopt);font-weight:600}
.sal.g{color:var(--playeropt);font-weight:600}
.sal.z{color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;height:180px;padding-top:10px}
.col{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:6px;text-align:center;min-width:0}
.col .track{position:relative;background:var(--soft);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
.col .fill{width:100%;background:var(--blue)}
.col .fill.over{background:var(--bad)}
.col .capl{position:absolute;left:0;right:0;border-top:2px dashed var(--ink);opacity:.55}
.col .lab{font:600 12px/1 var(--f-mono);color:var(--muted)}
.col .val{font:600 13px/1 var(--f-mono)}
.mini{display:grid;gap:8px;font-size:14px}
.mini .row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--soft);padding-bottom:6px}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.own{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.pill.in{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.out{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}

/* draft */
.ones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.one{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--card);display:grid;gap:6px}
.one .y{font:800 14px/1 var(--f-display);letter-spacing:.08em;color:var(--muted)}
.one .p{font:800 24px/1 var(--f-display);text-transform:uppercase}
.via{font-size:12px;color:var(--muted)}
.skip{color:var(--muted);font-style:italic}
.opts{display:flex;align-items:center;gap:8px}
.opts .b{height:8px;border-radius:4px;background:var(--blue);min-width:2px}

.hist td{vertical-align:top;min-width:150px}
.hist td:first-child,.hist td:last-child{min-width:0}
.pk{display:flex;gap:6px;align-items:baseline;font-size:12px;line-height:1.25;padding:4px 7px;border-radius:5px;margin-bottom:4px}
.pk b{font:600 11px/1 var(--f-mono);min-width:16px;opacity:.8}
.pk.lot{background:var(--blue);color:var(--blue-ink)}
.pk.r1{background:color-mix(in srgb,var(--blue) 22%,var(--card));color:var(--ink)}
.pk.r2{background:var(--soft);color:var(--ink)}
.pk.dr{background:var(--gold-soft);color:var(--ink)}
.pk.sk{opacity:.5;font-style:italic}

/* trades */
.tlist{display:grid;gap:12px}
.trade{border:1px solid var(--line);border-radius:var(--r);background:var(--card);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.trade .sd{padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.trade .sd+.sd{border-left:1px solid var(--soft)}
@media (max-width:560px){.trade .sd+.sd{border-left:0;border-top:1px solid var(--soft)}}
.trade .lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.trade .pk2{font-size:14px;overflow-wrap:anywhere}
.trade.new{border-color:var(--blue);box-shadow:inset 4px 0 0 var(--blue)}
.latest{display:grid;gap:12px;background:color-mix(in srgb,var(--blue) 8%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:var(--r);padding:18px}
.latest .trade{background:var(--card)}
.tmeta{font:500 12px/1 var(--f-mono);color:var(--muted);padding:10px 16px;grid-column:1/-1;border-top:1px solid var(--soft);display:flex;justify-content:space-between}

/* all-star */
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.score .s{font:900 clamp(44px,8vw,80px)/.9 var(--f-display)}
.score .c{font:800 18px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score .win .s{color:var(--blue)}
.score .vs{font:800 22px/1 var(--f-display);color:var(--muted)}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.aw{border:1px solid var(--gold);background:var(--gold-soft);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.aw .v{font:800 26px/1 var(--f-display);text-transform:uppercase}
.rook{font:600 10px/1 var(--f-body);letter-spacing:.08em;padding:3px 5px;border-radius:3px;background:var(--gold-soft);color:var(--gold);margin-left:6px}
ul.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}


/* woj */
.wojhead{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:20px}
.wojmark{font:900 clamp(44px,8vw,86px)/.86 var(--f-display);letter-spacing:.01em;color:var(--ink)}
@media (max-width:560px){.wojhead{grid-template-columns:1fr;gap:10px}}
.wart{display:grid;gap:12px}
.wtitle{font-size:clamp(32px,5vw,54px);text-transform:none;letter-spacing:0;max-width:22ch}
.wart .prose p{font-size:17px;line-height:1.6}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.pick{display:grid;gap:5px;align-content:start;border-top:1px solid var(--line);padding-top:10px}
ol.pr{list-style:none;margin:0;padding:0;columns:2;column-gap:20px}
@media (max-width:480px){ol.pr{columns:1}}
ol.pr li{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--soft);break-inside:avoid}
ol.pr .pill{font-size:9px;padding:3px 6px}
.wconf{max-width:75ch;font-size:16px;margin:0}
.wdiv{display:grid;gap:12px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px;align-items:start}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.wcard header{display:flex;justify-content:space-between;gap:10px;align-items:start}
.wcard .wr{display:flex;gap:8px;align-items:center}
.prk{font:800 22px/1 var(--f-display);color:var(--muted)}
.wcard p{margin:0;font-size:15px;line-height:1.55}
.wcard dl{margin:0;display:grid;gap:8px;border-top:1px solid var(--soft);padding-top:10px}
.wcard dl div{display:grid;grid-template-columns:130px 1fr;gap:10px;font-size:13px}
.wcard dt{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.wcard dd{margin:0}


/* popup */
.pop{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--ink) 55%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pop-card{position:relative;background:var(--card);color:var(--ink);border-radius:14px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.pop-top{background:var(--ink);color:var(--paper);padding:22px 22px 18px;display:grid;gap:6px}
.pop-top .eyebrow{color:var(--paper);opacity:.7}
.pop-top b{font:900 clamp(40px,10vw,56px)/.86 var(--f-display);letter-spacing:.01em}
.pop-body{padding:20px 22px 22px;display:grid;gap:12px}
.pop-body h3{text-transform:none;font-size:26px;letter-spacing:0}
.pop-body p{margin:0;color:var(--muted)}
.pop-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.btn{border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.pri{background:var(--blue);color:var(--blue-ink)}
.btn.sec{background:var(--soft);color:var(--ink)}
.pop-x{position:absolute;top:10px;right:12px;border:0;background:none;color:var(--paper);font-size:24px;line-height:1;cursor:pointer;opacity:.8}

.fin .tm,.one .tm,.pick .tm,.wcard .tm,.aw .tm,.thead .tm{white-space:normal}
/* misc */
.subtabs{margin-bottom:4px}
.neg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.ng{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;background:var(--card)}
.ng .top{display:flex;justify-content:space-between;align-items:center}
.ng .v{font:800 24px/1 var(--f-display)}
.ng .v.zero{color:var(--muted)}
.ng .v.up{color:var(--good)}
.ng .mv{font-size:12px;color:var(--muted);min-height:1em}
.empty{color:var(--muted);font-style:italic}

  const rd=(t,ms,f)=>`<div class="rd"><div class="t">${t}</div>${ms.map(m=>mu(m,f)).join('')}</div>`;

}

}

/* ---------- TRASPASSOS ---------- */
function vTraspassos(){
  const seasons=[...new Set(D.trades.map(t=>t.season))];
  const q=state.tq.toLowerCase();
  const list=D.trades.map((t,i)=>({...t,i})).filter(t=>(!state.tSeason||t.season===state.tSeason)&&(!state.tTeam||t.sides.some(s=>s.team===state.tTeam))&&(!q||t.sides.some(s=>s.gives.toLowerCase().includes(q)))).reverse();
  const cnt={}; D.trades.forEach(t=>t.sides.forEach(s=>cnt[s.team]=(cnt[s.team]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const lastS=seasons[seasons.length-1];
  const nofilter=!state.tSeason&&!state.tTeam&&!q;
  const feat=D.trades.map((t,i)=>({...t,i})).filter(t=>t.season===lastS).reverse().slice(0,4);
  const featIds=new Set(feat.map(t=>t.i));
  const card=(t,isNew)=>`<article class="trade${isNew?' new':''}">${t.sides.map(s=>`<div class="sd">${tm(s.team,{big:1,full:1})}<span class="lbl">Envia</span><span class="pk2">${esc(s.gives)}</span></div>`).join('')}<div class="tmeta"><span>${isNew?'<span class="pill own">Nou</span> ':''}${t.season}</span><span>${t.sides.length===3?'Traspàs a tres bandes':''}</span></div></article>`;
  const shown=nofilter?list.filter(t=>!featIds.has(t.i)):list;
  return `<section class="view">
  <div class="head"><div><div class="eyebrow">${D.trades.length} operacions registrades</div><h2>Traspassos</h2><p class="lede">Cada columna mostra el que envia aquella franquícia. Els més recents surten primer.</p></div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
   <div class="panel" style="display:grid;gap:10px"><h3>Filtres</h3>
    <div class="filters"><select id="tSeason"><option value="">Totes les temporades</option>${seasons.map(s=>`<option ${s===state.tSeason?'selected':''}>${s}</option>`).join('')}</select>
    <select id="tTeam"><option value="">Tots els equips</option>${D.teams.map(t=>`<option value="${t.abbr}" ${t.abbr===state.tTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <input type="search" id="tq" placeholder="Busca un jugador o una ronda" value="${esc(state.tq)}" style="flex:1"></div>
    <span class="note">${list.length} traspassos</span></div>
   <div class="panel"><h3>Els més actius</h3><div class="rank">${top.map(([a,n])=>`<div class="r">${tm(a,{link:1})}<div class="b"><i class="s" style="width:${n/top[0][1]*100}%"></i></div><span class="num mono">${n}</span></div>`).join('')}</div></div>
  </div>
  ${nofilter?`<div class="latest"><div class="head"><div><div class="eyebrow">${lastS} · ${D.trades.filter(t=>t.season===lastS).length} traspassos</div><h3 style="margin-top:6px">Últims traspassos</h3></div></div>${feat.map(t=>card(t,true)).join('')}</div><h3>Tots els traspassos</h3>`:''}
  <div class="tlist" id="tlist">${shown.map(t=>card(t,t.season===lastS)).join('')||'<p class="empty">Cap traspàs amb aquests filtres.</p>'}</div>
  </section>`;
}

   <div class="panel"><span class="eyebrow">Seleccionadors</span><p style="margin:8px 0 0;font-size:14px"><b>Est:</b> ${A.sel.E.map(esc).join(', ')}<br><b>Oest:</b> ${A.sel.W.map(esc).join(', ')}</p></div></div>
  <div class="grid2">${ros(A.east,'Plantilla Est')}${ros(A.west,'Plantilla Oest')}</div>
  <div class="grid2">
   <div class="panel"><h3>Concurs de triples</h3><div class="tw"><table><thead><tr><th>Pos.</th><th>Equip</th><th>Jugador</th><th class="n">Triples</th><th class="n">%</th></tr></thead><tbody>${c.map(x=>`<tr><td class="mono">${esc(x.rank||'')}</td><td>${tm(x.team)}</td><td>${esc(x.player)}</td><td class="n mono">${esc(x.made)}</td><td class="n mono">${x.pct==null?'—':Math.round(x.pct*100)+'%'}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="panel"><h3>Normes i recompenses</h3><ul class="rules">
    <li>Plantilles de 15 jugadors, amb un mínim de 2 rookies.</li><li>Minuts disponibles: 200 de G, 200 de F i 100 de C.</li>
    <li>Els seleccionadors són els 3 millors classificats de cada conferència en acabar el Game 20.</li>
    <li>Les plantilles i el participant de triples es tanquen el 24/12 a les 18:00 pel grup de WhatsApp.</li>
    <li>MVP: el jugador que més valoració aporta al seu equip segons el percentatge de minuts. Desempat: conferència guanyadora, valoració per minut i sorteig.</li>
    <li>Triples: guanya qui en fa més al Game 32. Desempat pel percentatge del partit i després pels de la temporada.</li>
    <li>MVP i guanyador de triples: 1 negociador extra l'any següent per a la franquícia propietària.</li>

   <div class="pop-top"><span class="eyebrow">Nova secció</span><b>THE BUÉS<br>CORNER</b></div>
   <div class="pop-body"><span class="eyebrow">${esc(A.kicker)} · ${esc(A.date)}</span><h3 id="popT">${esc(A.title)}</h3>
   <p>Les 30 plantilles analitzades una per una, el power ranking, els favorits de cada conferència i les apostes per a la temporada 2026-27. Aquí ens mullem.</p>
   <div class="pop-actions"><button class="btn pri" data-pop="read">Llegir l'anàlisi</button><button class="btn sec" data-pop="close">Ara no</button></div></div></div>`;
  p.hidden=false;
  setTimeout(()=>p.querySelector('.btn.pri')?.focus(),50);
}
function closePop(){document.getElementById('pop').hidden=true; try{localStorage.setItem(POPKEY,'1')}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('pop').hidden) closePop();});

const RENDER={inici:vInici,bues:vWoj,palmares:vPalmares,plantilles:vPlantilles,draft:vDraft,traspassos:vTraspassos,allstar:vAllstar,miscel:vMiscel,resultats:vResultats};
const app=document.getElementById('app');
function render(scroll){
  document.getElementById('tabs').innerHTML=VIEWS.map(([k,l])=>`<button role="tab" aria-selected="${k===state.view}" data-go="${k}">${l}</button>`).join('');
  app.innerHTML=RENDER[state.view]();
  try{const at=document.querySelector('.tabs [aria-selected="true"]'); const n=document.getElementById('tabs'); n.scrollLeft=at.offsetLeft-n.clientWidth/2+at.clientWidth/2;}catch(e){}
  if(scroll) window.scrollTo({top:0});
}
function go(v,scroll=true){state.view=v; try{history.replaceState(null,'','#'+v)}catch(e){} render(scroll);}
document.addEventListener('click',e=>{
  const pp=e.target.closest('[data-pop]'); if(pp){const a=pp.dataset.pop; closePop(); if(a==='read') go('bues'); return;}
  if(e.target.id==='pop'){closePop(); return;}
  const t=e.target.closest('[data-team]'); if(t){state.team=t.dataset.team; save(); go('plantilles'); return;}
  const g=e.target.closest('[data-go]'); if(g){e.preventDefault(); go(g.dataset.go); return;}
  const h=e.target.closest('th[data-heat]'); if(h){state.sortHeat=h.dataset.heat; render(); return;}
  const o=e.target.closest('th[data-ov]'); if(o){const k=o.dataset.ov; state.sortOv=[k, state.sortOv[0]===k&&state.sortOv[1]==='desc'?'asc':'desc']; render(); return;}
  const b=e.target.closest('.seg button'); if(b){const id=b.parentElement.id;
    if(id==='dYear') state.draftYear=+b.dataset.y; if(id==='lYear') state.lot=+b.dataset.y; if(id==='hRound') state.hRound=b.dataset.r; if(id==='wConf') state.wConf=b.dataset.c; if(id==='wArt') state.woj=+b.dataset.i; if(id==='nYear') state.negYear=+b.dataset.y; if(id==='mSub') state.misc=b.dataset.s; render(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='teamSel'){state.team=e.target.value; save(); render();}
  if(e.target.id==='tSeason'){state.tSeason=e.target.value; render();}
  if(e.target.id==='tTeam'){state.tTeam=e.target.value; render();}
  if(e.target.id==='hTeam'){state.hTeam=e.target.value; render();}
});
document.addEventListener('input',e=>{ if(e.target.id==='tq'){state.tq=e.target.value; const pos=e.target.selectionStart; render(); const i=document.getElementById('tq'); i.focus(); try{i.setSelectionRange(pos,pos)}catch(_){} }});
const h=(location.hash||'').slice(1); if(RENDER[h]) state.view=h;
const hm=h.match(/^([a-z]{3})$/i); if(hm&&TEAM[hm[1].toUpperCase()]){state.team=hm[1].toUpperCase(); state.view='plantilles';}
document.getElementById('foot').innerHTML=`Dades de l'Excel <b>ROSTERS BALLDONTLIE</b> i de sports.ws (BALLDONTLIE – Year 7), recollides el ${D.updated}. Plantilles i salaris: web de la lliga.`;
render(false);
if(state.view==='inici') showPop();
</script>

</body>
</html>
