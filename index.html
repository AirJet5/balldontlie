const WOJ = {"articles":[{"id":"sunday-01","series":"sunday","issue":"Setmana 1","kicker":"Sunday Lovers #1","date":"25 d'octubre de 2026","title":"Mil rellotges i cap hora: la primera setmana de la BALLDONTLIE","pop":"Crònica de la primera setmana i dels dos primers partits: els 30 equips, els temes calents, el protagonista, els jugadors sorpresa i decepció i els premis de la setmana. Amb picant, però sa.","intro":["Dos partits complets i el tercer ja en marxa. La temporada 2026-27 ha arrencat amb deu equips invictes, deu amb un 1-1 i deu que encara busquen la primera victòria. I, de moment, la competició més disputada ha estat fora de la pista: la de qui arriba primer a un botó.","Aquesta és la primera entrega de Sunday Lovers, la crònica dominical de The Bués Corner. Cada diumenge repassarem la jornada, els números, els herois, els desastres i els mànagers que han fet soroll. Els partits del Game 3 encara són provisionals mentre escric: tot el que diu aquí sobre aquesta tercera jornada pot canviar abans de la sirena final.","Preparats? Comencem pel que ha passat entre bastidors, perquè aquesta setmana el protagonisme no l'han tingut els jugadors sinó els rellotges."],"highlights":[["El més ràpid de l'Oest ha fracassat","El mercat de lliures havia d'obrir a les 00:01 i guanyar el més ràpid. Toronto va reclamar Hezonja i LeVert abans de l'hora d'inici i, en haver-los de tallar, el joc els va marcar com a waivers: ja no es poden reclamar a l'instant i s'hauran de sortejar. Cal una solució per a la temporada que ve i ja té nom provisional: la «Hezonja rule»."],["Les hores no marquen igual per a tothom","76ers i Raptors la lien a l'obertura dels FA's. Uns arriben abans de l'hora; els altres, molt després. Si algú encara tenia dubtes que a la lliga hi ha més d'un fus horari, ja pot deixar de dubtar."],["Sabonis desfermat a San Antonio","Domantas Sabonis ha fet 33,5 i 41,0 de FP, amb un 27-19-10 al segon partit, i lidera uns Spurs 2-0 (132,3 a 101,0 contra Boston i 125,8 a 108,3 contra Minnesota). Amb Jalen Johnson (29,3) i Wembanyama (22,5) al costat, Javi té el trident més temible de l'Oest."],["Dallas i Memphis, separats per 0,1 punts","Els Mavericks lideren l'Oest amb 141,7 de mitjana per només 0,1 sobre els Grizzlies (141,6). Houston és tercer amb 140,0. L'Oest té quatre equips per sobre de 132 de mitjana i vuit equips de l'Oest no arriben als 110 de mitjana. La conferència del volum ha començat sense frens."],["Kevin Porter Jr.: queda un dia","Dilluns 26 d'octubre caduca el termini de set dies perquè Kevin Porter Jr. trobi un contracte real a l'NBA i Chicago no el perdi. Elio va lluitar per canviar la norma i quedar-se'l, amb una insistència absolutament desinteressada, per descomptat. Però el temps se li acaba. Tic, tac."]],"protagonist":{"ab":"PHI","name":"Jordi","team":"Philadelphia 76ers","title":"Jordi, el mànager que juga a un altre fus horari","text":["Tres fets: va guanyar Dore (122,4 a 116,5), va perdre amb estrèpit contra Houston (109,1 a 149,5, el millor registre de la lliga fins ara) i va firmar Damian Lillard. És aquest últim el que l'ha convertit en el protagonista de la setmana.","Jordi va fitxar Lillard sense saber que el seu contracte era un buyout amb un salari molt superior al que pensava. Amb el sou complet no s'ho pot permetre i havia de tallar un jugador a l'instant. Va demanar el matí per decidir-ho i, quan escric, ja n'han passat més de 32 hores sense que hagi tallat ningú.","L'explicació, potser, és geogràfica: Jordi és al Brasil, i allà el temps sembla córrer d'una altra manera. Mentre aquí ja és diumenge al matí, a Brasília encara deu estar rumiant quin matí era el seu. Mentrestant, els Sixers juguen el Game 3 contra Dallas amb una plantilla que encara no sap qui sobra. Un 1-1 amb un nucli veterà (Lillard 21,0, Lopez 21,0, Leonard 18,3) és perfectament defensable; el que no ho és tant és tenir el rellotge en pausa."]},"surprises":[["Domantas Sabonis","SAS","Javi","37,3 de mitjana, amb una nit de 27 punts, 19 rebots i 10 assistències. Els seus 21,9 de l'any passat ara fan riure."],["Ty Jerome","ORL","Lluís","29,8 de mitjana (18,5 la temporada passada), amb 45 punts al Game 1. De sisè home a líder d'una de les millors ofensives."],["Devin Booker","SAC","Pol","27,3 de mitjana (20,3 l'any passat) i 43 punts al segon partit. I, tot i així, 0-2: un lloc ben trist per ser el millor."],["Wendell Carter Jr.","BKN","Gerard","23,8 de mitjana contra 15,6 de l'any anterior. L'únic que respon en un Brooklyn 0-2."],["Brook Lopez","PHI","Jordi","21,0 de mitjana, més del doble que els 10,2 de l'any passat. El Sixer inesperat."]],"disappointments":[["Nikola Vucevic","DET","Dore","1,8 de mitjana (19,7 l'any passat) en només 5,3 i 3,6 minuts. Això no és una baixada, és una desaparició."],["Mikal Bridges","ATL","Edgar","3,0 de mitjana contra 16,5. Amb 33,1 minuts va fer 5,0 de FP, i amb 21,9 minuts, 1,0. El pitjor inici possible."],["Desmond Bane","DET","Dore","7,3 de mitjana (18,3 l'any passat): 15,0 el primer dia i -0,5 el segon. Sí, negatiu."],["Kyle Filipowski","MIL","Martí","0,5 de mitjana (15,3 l'any passat) amb només 9,0 i 7,6 minuts. Entra i surt de la pista sense que ningú se n'adoni."],["Jalen Brunson","BKN","Gerard","13,0 de mitjana contra 21,9 l'any passat. Un Brooklyn 0-2 que ha perdut el seu estel."]],"honorable":"Menció d'honor entre els decebuts: Luka Doncic (19,3 contra 31,0 l'any passat) i DeMar DeRozan (6,3).","awards":[["Equip en forma","MEM","Memphis: +147,1 de diferència acumulada en dos partits (148,8 a 77,5 a Brooklyn i 134,5 a 58,7 contra Milwaukee). L'únic que ho aguanta de prop és Dallas, a 0,1 de mitjana."],["Tanking mode","ATL","Atlanta: 0-2, 60,5 de mitjana, un 51,0 al Game 1 (el pitjor registre de la lliga) i cinc jugadors a 0,0. A més, el 44,5 de Jokic al segon partit va ser el 63,6% del total de l'equip (70,0)."],["Mala sort","DET","Detroit i Nova Orleans: 0-2 amb 108,2 de mitjana, més que cinc equips que sí que han guanyat (Chicago, Clippers, Lakers, Minnesota i Oklahoma). Les matemàtiques són cruels."],["Massacre de la setmana","MIL","Milwaukee 58,7 a Memphis 134,5: 75,8 punts de diferència, la derrota més gran dels dos primers partits."],["At The Buzzer","MIA","Miami 105,0 a Toronto 103,1: només 1,9 punts de diferència, el final més ajustat de les dues jornades (el segueix Nova York 115,2 a Boston 117,5, per 2,3)."],["Catenaccio","MIN","Minnesota va guanyar a Sacramento amb només 90,0 punts, la victòria amb menys puntuació dels dos partits. Oklahoma, amb 91,0, és la segona."],["Muntanya russa","DEN","Denver: 135,1 contra Milwaukee i 94,0 contra Chicago. 41,1 punts de diferència entre un partit i l'altre."],["Premi «Arribar i besar el sant»","CHI","Chicago és 2-0 amb la mitjana més baixa dels invictes (99,8). Guanyar de qualsevol manera també és una forma de fer-ho."]],"order":{"E":["ORL","CLE","MIA","CHI","CHA","PHI","NYK","TOR","BOS","DET","WAS","IND","BKN","MIL","ATL"],"W":["DAL","MEM","POR","SAS","PHO","LAC","HOU","DEN","MIN","OKC","LAL","NOP","UTA","GSW","SAC"]},"teams":{"ORL":"En Lluís lidera l'Est amb una mitjana de 128,8 i el 145,1 del Game 1 ja va deixar clar que aquest equip no ve a fer volum. Ty Jerome (29,8 de mitjana, amb 45 punts en el primer partit) és la gran sorpresa i Towns (23,5) i Hart (20,3) fan la feina feixuga. Doncic encara va per sota del que s'espera (19,3). Si el 7 arrenca de debò, la resta de la conferència té un problema.","CLE":"En Gerard té dues victòries, dos rivals que encara no han guanyat (Washington i Indiana) i una diferència acumulada de +89,5. Scottie Barnes (24,5) i Ayo Dosunmu (19,8) lideren un equip sense noms de portada però amb una plantilla molt ben repartida. Ara arriba l'examen de veritat: al Game 3 rep Denver, un equip que va fer 135,1 al Game 1. Tot el que ha passat abans era l'escalfament.","MIA":"L'Eloy guanya amb el que té: 105,0 a Toronto per només 1,9 punts, el partit més ajustat de les dues jornades, i un 114,5 contra Detroit. Shai Gilgeous-Alexander (21,5) i Naz Reid (21,0) aguanten un equip que, amb Jalen Williams a 15,3, encara té marge per créixer. Un 2-0 amb 109,7 de mitjana és discret, fiable i amb una dosi de sort que ja veurem fins quan dura.","CHI":"L'Elio és 2-0 amb la mitjana més baixa de tots els invictes (99,8): 93,5 contra Indiana i 106,1 a Denver. Paolo Banchero (24,8) porta el pes d'un equip que guanya per la mínima i de moment sense gaire brillantor. Els números diuen que és sòlid; el calendari diu que encara no ha trobat un rival de veritat. I a més té un ull posat en el rellotge de Porter Jr., que caduca demà.","CHA":"En Jesús va perdre el Game 1 amb 129,5 punts, una xifra que gairebé sempre és victòria, perquè s'hi va trobar un 145,1 d'Orlando. Es va redimir amb un 130,3 a Nova Orleans. Dyson Daniels (22,8) i Yves Missi (18,8) són els motors d'un equip amb el cinquè millor promig de la lliga (129,9) i motius de sobra per ser optimista.","PHI":"En Jordi va guanyar Dore (122,4 a 116,5) i després es va estavellar contra Houston (109,1 a 149,5, el millor registre de la lliga fins ara). Brook Lopez (21,0), Damian Lillard (21,0) i Kawhi Leonard (18,3) formen un nucli veterà que dona per a un 1-1 ben defensable. El problema està fora de pista: Lillard ha arribat amb un contracte que no esperava i encara falta un tall. Aquest cap de setmana rep Dallas.","NYK":"En Joan va passejar contra Utah (113,5 a 85,8) i va perdre per només 2,3 punts a Boston (115,2 a 117,5), d'aquells partits que es decideixen amb l'últim cistell de la nit. Jayson Tatum (25,8) i Tyrese Maxey (23,5) són un tàndem d'elit i Dylan Harper (17,5) ja demostra que hi ha futur. Si el segon partit hagués anat de l'altra banda, seria 2-0 i ningú parlaria d'altra cosa.","TOR":"En David va perdre el Game 1 per 1,9 (103,1 a 105,0) i va guanyar a Washington (125,1 a 112,0). Kevin Durant (20,5) i Nickeil Alexander-Walker (19,8) mantenen el nivell. Però el que ha fet soroll no és això: Toronto va reclamar Hezonja i LeVert abans de l'hora d'obertura, els va haver de tallar i ara són a waivers. Premi a la iniciativa, zero a la puntualitat. La «Hezonja rule» ja té protagonista.","BOS":"En Carles ha viscut un petit vaivé: 101,0 contra els 132,3 de San Antonio al Game 1 i un 117,5 a favor contra Nova York al segon. Siakam i Edgecombe (17,8), DeAndre Jordan i Duren (17,5) conformen una plantilla molt equilibrada, sense cap estrella que se'n vagi de mare. El Game 3 ha començat bé: provisionalment guanya 99,0 a 57,5 a Portland, tot i que encara queda molt partit.","DET":"En Dore té el 0-2 més injust de la lliga: 116,5 contra Philadelphia i 100,0 a Miami, amb una mitjana de 108,2 que supera la de cinc equips que sí que han guanyat. Jamal Murray (20,3), Justin Champagnie (17,7) i Jabari Smith Jr. (17,5) responen, però Desmond Bane (7,3) i Nikola Vucevic (1,8) no. Si aquests dos es posen d'acord amb el guió, la remuntada serà ràpida.","WAS":"En Roger té Giannis (23,7) i poca cosa més: 57,5 contra Cleveland al Game 1, el segon pitjor registre de la lliga només superat pel 51,0 d'Atlanta. Al Game 2 va pujar fins als 112,0 contra Toronto, encara que no va bastar. P.J. Washington (14,5) i Josh Giddey (13,3) intenten fer de segon violí. Provisionalment, el Game 3 li somriu: guanya 72,5 a 49,0 contra Detroit.","IND":"En Víctor encara espera la primera victòria: 82,5 contra Chicago (perd per 11 punts) i 79,1 contra els 122,0 de Cleveland. Zach LaVine (17,8) és l'únic que respon de veritat; Keldon Johnson (11,5) i Sandro Mamukelashvili (10,8) acompanyen. Amb només dotze jugadors a la plantilla, qualsevol baixa pesa el doble. Falta pols, falta full i falta una mica de sort per a un equip que ha començat amb el fre de mà posat.","BKN":"En Gerard (BKN) ha començat amb dues derrotes: 77,5 contra els 148,8 de Memphis i 61,0 a Orlando. Wendell Carter Jr. (23,8) és l'únic que juga per sobre del que s'esperava; Bam Adebayo (16,3) i Jalen Brunson (13,0) cobren molt per al que estan donant. Amb només onze jugadors a la plantilla, qualsevol imprevist es nota més del compte. De moment, el Game 3 contra Nova Orleans no sembla més fàcil.","MIL":"En Martí ha rebut la pallissa de la setmana: 58,7 a Memphis contra 134,5, una diferència de 75,8 punts, la derrota més gran dels dos primers partits. Abans, 67,9 contra Denver. Austin Reaves (23,5) i Stephen Curry (16,5) aguanten com poden i Kyle Filipowski (0,5 de mitjana, amb 9,0 i 7,6 minuts) no suma res. Amb onze jugadors a la plantilla, la remuntada demana feina i paciència.","ATL":"L'Edgar és ara mateix l'equip més estrany de la lliga: Nikola Jokic (29,0 de mitjana) i deu figurants. Va firmar el pitjor registre de totes les jornades (51,0 a Oklahoma City) i, en el segon partit, el 44,5 de Jokic va ser el 63,6% dels 70,0 totals de l'equip. Cinc jugadors tenen 0,0 de mitjana. Mikal Bridges (3,0) no acaba d'arrencar. 0-2 amb el millor jugador del món i cap pla B.","DAL":"Dallas és primer de l'Oest per la mínima: 141,7 de mitjana, 0,1 per sobre de Memphis. Va guanyar a Houston (141,8 a 130,6) i va passejar contra Sacramento (141,7 a 78,5). Walker Kessler (29,8) és la gran figura d'un equip amb quatre jugadors per sobre de 17 de mitjana i molta profunditat. Si algú pensava que el 141,8 era cosa d'un dia, el 141,7 del dia següent ho va desmentir.","MEM":"En Xavi té el 2-0 més contundent de la lliga: 148,8 a Brooklyn (77,5) i 134,5 contra Milwaukee (58,7), una diferència acumulada de +147,1. Julius Randle (24,8), Donovan Mitchell (23,3) i Deni Avdija (22,0) són l'esquelet d'un equip amb fons d'armari, perquè fins i tot Paul Reed (19,3) està donant molt més del que s'esperava. Només els 0,1 de Dallas li impedeixen ser el rei de la mitjana.","POR":"En Gorka va debutar amb un 117,0 contra els Lakers (66,4) i va continuar amb un 147,8 a Utah (86,6), el tercer millor registre de les dues jornades. Trae Young (21,3), RJ Barrett (21,0) i Cameron Boozer (20,8) són els tres motors d'un equip molt repartit, i Jaxson Hayes (18,5) i Jarrett Allen (18,0) completen un grup amb molta profunditat. Té el quart millor promig de la lliga (132,4) i catorze jugadors útils. De moment, tot va com una seda.","SAS":"En Javi té el millor jugador de la setmana: Domantas Sabonis ha fet 33,5 i 41,0 de FP (27 punts, 19 rebots i 10 assistències al segon partit). Si hi afegim Jalen Johnson (29,3) i Victor Wembanyama (22,5), el trident és de luxe. Va guanyar Boston (132,3 a 101,0) i Minnesota (125,8 a 108,3). Té el sisè millor promig (129,0) i el moment ideal per començar a parlar de candidat de debò.","PHO":"L'Ander és l'equip de les victòries tranquil·les: 125,3 contra Nova Orleans i 119,7 a Golden State. Alperen Sengun (24,8) és el líder d'un grup molt repartit, amb Jaden McDaniels (20,5), Davion Mitchell (17,8) i Jalen Smith i Zion Williamson (17,2). No té cap estrella que se'n vagi de les mans, però tampoc cap forat greu. Amb una mitjana de 122,5, és un equip que sembla còmode amb el que té i amb ganes de molestar els grans.","LAC":"En Valen és 2-0 amb una mitjana moderada (106,6) i victòries clares contra rivals sense victòries: Golden State (109,1 a 74,7) i Atlanta (104,2 a 70,0). Dejounte Murray (22,3) i Anthony Davis (18,7) lideren; DeMar DeRozan (6,3) encara no ha aparegut. Un inici correcte, amb un calendari amable i amb el repte de demostrar que aquest 2-0 no és un miratge. El Game 3 contra els Lakers decidirà si el miratge es manté.","HOU":"En Ignasi té el tercer millor promig de la lliga (140,0) i només un 1-1, perquè la primera derrota va arribar contra el rival que més puntua. 130,6 contra 141,8 és mala sort. L'endemà va arrasar a Philadelphia amb 149,5, el millor registre de la lliga fins ara. Amen Thompson (23,7), Cooper Flagg (22,5) i Jaylen Brown (22,2) són la raó del seu domini en la distància. Falta la regularitat.","DEN":"En l'Alex va pujar de 135,1 contra Milwaukee a 94,0 contra Chicago en una sola nit: 41,1 punts de diferència entre dos partits. Anthony Edwards (25,3), Tyrese Haliburton (22,8) i Ivica Zubac (19,8) tenen un sostre alt, però la plantilla té massa jugadors que no sumen. Va guanyar amb escreix al Game 1 i va perdre contra un Chicago que només va fer 106,1. Cal una mica més de constància.","MIN":"En Marc va guanyar a Sacramento amb només 90,0 punts, la victòria amb menys puntuació de la lliga. Al Game 2 va fer 108,3, però San Antonio en va fer 125,8. LeBron James (21,0) és el millor, seguit de Yaxel Lendeborg (19,8) i Jaren Jackson Jr. (18,8). Amb només dotze jugadors a la plantilla, l'equip té poc marge per a imprevistos. El Game 3 és contra Nova York, i no serà un passeig.","OKC":"L'Aleix va guanyar el Game 1 amb 91,0 punts (la segona victòria més baixa), perquè Atlanta només va fer 51,0. Al Game 2 va perdre per 4,0 a casa dels Lakers, amb 106,5. Evan Mobley (23,8) i Chet Holmgren (22,8) són una parella de pivots que mereix un equip més complet al voltant; Andrew Nembhard (17,3) hi col·labora. Amb dotze jugadors a la plantilla, l'equip té una mica de joc però pocs recursos.","LAL":"En David (LAL) va passar de 66,4 contra Portland (117,0) a una victòria 110,5 a 106,5 contra Oklahoma City, i és l'equip amb la mitjana més baixa de tots els que han guanyat (88,4). Michael Porter Jr. (25,8) és el rei de l'equip, amb Caleb Wilson (18,0) i Grayson Allen (15,0) darrere seu. Aquest cap de setmana mana contra els Clippers: provisionalment, 91,3 a 59,7.","NOP":"En Josep té el mateix 108,2 que Detroit i el mateix 0-2: 113,8 a Phoenix (perd per 11,5) i 102,6 contra Charlotte (que en va fer 130,3). Jaime Jaquez (20,5), Ja Morant (18,8) i Fred VanVleet (18,5) són un tres de qualitat, però amb dotze jugadors a la plantilla i Porzingis a 0,0, la profunditat és poca. Mala sort, sí, però també poca profunditat. Els números no menteixen.","UTA":"L'Enric ha perdut amb 85,8 a Nova York i amb 86,6 contra el 147,8 de Portland, una diferència de 61,2 punts. OG Anunoby (16,0), Derrick Jones Jr. (15,8) i Ace Bailey (12,8) són els més regulars; Jalen Green (7,3) encara busca el seu lloc, i Shaedon Sharpe està a l'inactive list. Té catorze jugadors i només quatre per sobre de 12 de mitjana: més volum que qualitat.","GSW":"En Sergi té Joel Embiid (23,0) i poc més: Jonathan Kuminga (16,8) i Jakob Poeltl (12,3) són els altres. Va perdre a Los Angeles (74,7 a 109,1) i contra Phoenix (91,0 a 119,7). Brandon Ingram segueix a l'inactive list. L'equip té tretze jugadors i molts zeros. Per ara, la mitjana (82,8) diu que cal remuntar abans que sigui tard.","SAC":"En Pol té Devin Booker (27,3 de mitjana, amb 43 punts al segon partit) i cap victòria: 80,0 contra els 90,0 de Minnesota i 78,5 contra els 141,7 de Dallas. LaMelo Ball (16,8) i Kyshawn George (14,7) acompanyen com poden. Hi ha una dada que fa mal: un dels jugadors de la setmana és d'un equip sense victòries. Quan un jugador fa 43 i l'equip perd per 63, alguna cosa falla."}},{"id":"previa-2627","date":"8 d'octubre de 2026","kicker":"Early Season Thoughts","title":"Tothom té un pla fins que arriba el Game 1","intro":["Queden pocs dies perquè el 20 d'octubre arrenqui l'any 7 de BALLDONTLIE. Hem repassat les 30 plantilles de la web, l'historial de cada franquícia, els traspassos de l'estiu i les notícies de la NBA: lesions, canvis d'equip i qui jugarà minuts de veritat.","Aquí no hi ha tebiesa. Hi ha favorits, hi ha qui ha guanyat l'estiu i hi ha qui l'haurà d'explicar al grup de WhatsApp. Si no estàs d'acord, tens fins al 20 d'octubre per fer un traspàs abans que comenci la temporada."],"picks":[["Campió","SAS","San Antonio, per sobre de Chicago a la final"],["Finalista","CHI","L'equip més complet de l'Est"],["MVP de la lliga","ATL","Nikola Jokic. 37 FPPG no són normals"],["Moviment de l'estiu","SAC","Devin Booker arriba a Sacramento"],["Sorpresa","DEN","Torna Haliburton i entra Maluach"],["Decepció","BKN","Han marxat Reaves i Banchero"],["Rookie a seguir","POR","Cameron Boozer, minuts des del primer dia"]],"power":["SAS","CHI","SAC","HOU","ORL","MEM","MIA","PHI","DET","DAL","PHO","WAS","BOS","CHA","NYK","ATL","LAC","MIN","CLE","GSW","BKN","POR","LAL","IND","OKC","DEN","MIL","NOP","UTA","TOR"],"confs":{"E":"L'Est té un favorit clar i quatre aspirants. Chicago ha afegit Banchero a un equip que ja va fer 46-12, Orlando té Luka i dos anells a la vitrina, i Miami arriba amb SGA, Jalen Williams recuperat i la ràbia d'haver perdut la final. Philadelphia depèn de la salut de Kawhi i Detroit ho ha apostat tot a aquesta temporada. La lluita bona és pels últims llocs de playoffs: Boston, New York, Washington i un Charlotte que té Harden renovat a Cleveland hi tenen opcions.","W":"L'Oest és la conferència dels pesos pesants. San Antonio té la millor plantilla de la lliga, Sacramento ha guanyat l'estiu amb Booker, Houston vol esborrar l'0-3 de primera ronda i Memphis defensa l'anell. Darrere seu, Dallas i Phoenix són equips de playoffs, i el play-in serà una guerra entre Clippers, Minnesota, Golden State i un Portland que no pot tornar a fer 13-45."},"teams":{"BOS":{"tag":"Playoffs","move":"Arriba Jalen Duren (2 primeres i 1 segona a OKC)","key":"Jalen Duren","watch":"Reed Sheppard","text":"En Carles ha fet all-in per Jalen Duren: dues primeres rondes i una segona per un All-NBA de 22 anys. L'aposta ha sortit bé a la NBA: el 2 d'octubre Duren va tancar amb Detroit una renovació de cinc anys i 200 milions, així que tindrà pilota i minuts garantits (a la web de la lliga encara surt sense salari). Amb Siakam i Queta, Boston té un joc interior que fa por. El problema és el context: a Queta li han portat Mitchell Robinson als Celtics, Siakam recupera Haliburton al costat i Edgecombe haurà de demanar torn darrere LeBron i Jaylen Brown. Ull a Reed Sheppard, que amb VanVleet lesionat té minuts de base a Houston."},"BKN":{"tag":"Play-in","move":"Surten Austin Reaves i Paolo Banchero; arriben Coby White, Kornet, Wendell Carter i Bones Hyland","key":"Jalen Brunson","watch":"Coby White","text":"L'estiu més estrany de la lliga. En Gerard ha deixat anar Austin Reaves i Paolo Banchero, dos dels millors jugadors de la plantilla, i a canvi han arribat Coby White, Wendell Carter Jr., Luke Kornet i Bones Hyland. Coby serà titular a Charlotte després de la sortida de LaMelo i pot disparar els números, però el sostre de l'equip ha baixat. Adebayo haurà de compartir pintura amb Giannis a Miami i Brunson segueix sent el de sempre. Equip de mitja taula que al maig haurà d'explicar per què va fer el que va fer."},"NYK":{"tag":"Playoffs","move":"Torna Kyrie Irving després de 19 mesos de baixa","key":"Jayson Tatum","watch":"Kyrie Irving","text":"La temporada passada va ser per oblidar (23-35), però aquí hi ha material per pujar molts esglaons. Tatum i Maxey formen una parella de més de 50 FPPG, tot i que Maxey ara comparteix pilota amb LeBron i Jaylen Brown a Philly. Dylan Harper va pel segon any a San Antonio i Kyrie Irving ha entrat al training camp de Dallas sense restriccions després de 19 mesos de baixa: si recupera la meitat del que era, és un fitxatge d'estiu sense tocar el mercat. El dubte és la pintura, amb Ware compartint minuts amb Myles Turner a Milwaukee. El meu candidat a sorpresa de l'Est."},"PHI":{"tag":"Candidat","move":"Kawhi Leonard torna a Toronto i serà la primera opció","key":"Kawhi Leonard","watch":"Derik Queen","text":"Kawhi torna a Toronto, on va ser feliç, i Philly ho celebra: si juga 60 partits, és un dels deu millors jugadors de la lliga. El matís és que la NBA ha investigat el traspàs per temes salarials i qualsevol sanció la pagaria ell. Al seu voltant, Keyonte George (20 FPPG a Utah) i el segon any de Derik Queen donen recorregut, i Diabate i Peyton Watson, ara a Cleveland, fan la feina bruta. Jrue Holiday, en canvi, es baralla amb Lillard, Morant i Henderson per minuts a Portland. Playoffs segurs i, amb Kawhi sa, alguna cosa més."},"TOR":{"tag":"Reconstrucció","move":"Kuminga marxa per Aaron Gordon i una primera del 2027","key":"Kevin Durant","watch":"AJ Dybantsa","text":"Toronto ha decidit que el futur és ara... d'aquí a tres anys. Té tres rookies de primera ronda (AJ Dybantsa, número 1 del draft, Kingston Flemings i Ebuka Okorie) i el present el sostenen un Kevin Durant de 38 anys i Nickeil Alexander-Walker. Kuminga ha marxat a canvi d'Aaron Gordon i una primera, moviment de manager que mira el 2028. Dybantsa tindrà pilota a Washington, però amb Trae, Anthony Davis i Sarr no serà el primer plat. Temporada de patir i de mirar molt la loteria."},"CHI":{"tag":"Candidat","move":"Arriba Paolo Banchero (marxen Wendell Carter i Bones Hyland)","key":"Paolo Banchero","watch":"Danny Wolf","text":"Sempre hi són. L'Elio va fer un 46-12 i, en lloc de quedar-se quiet, ha anat a buscar Paolo Banchero a canvi de Wendell Carter i Bones Hyland. Banchero, Kevin Porter Jr., Gobert, Derrick White i Pritchard: perfils diferents, totes les posicions cobertes i Claxton com a assegurança a la pintura. L'única ombra és KPJ, que haurà de compartir pilota amb Tyler Herro a Milwaukee. És l'equip més complet de l'Est i el meu favorit de la conferència. Danny Wolf pot rascar minuts de pivot en uns Nets que només tenen Sharpe i Wagner en aquesta posició. Algú ha provat de demanar-li un traspàs? Ni ho intenteu."},"CLE":{"tag":"Play-in","move":"Cap moviment a l'estiu","key":"Scottie Barnes","watch":"Deandre Ayton","text":"Scottie Barnes i Trey Murphy III són una base de luxe, però aquest any Barnes tindrà Kawhi al costat i la pilota es repartirà. Garland i Ayton aporten volum, i Dosunmu té un contracte de cinc anys que diu molt de la confiança del manager. El que falta és un salt de qualitat: 26-32 l'any passat i un estiu sense tocar res. Si Ayton manté els 16,5 FPPG i Garland juga sa als Clippers, pot discutir el play-in. Si no, serà un any llarg."},"DET":{"tag":"Playoffs","move":"Arriben Jabari Smith Jr. i Immanuel Quickley a canvi de primeres del 2027 i 2028","key":"Jamal Murray","watch":"Dylan Cardwell","text":"El manager més actiu de l'estiu. En Dore ha pagat primeres rondes per Jabari Smith Jr. i per Immanuel Quickley, i s'ha tret de sobre peces que no jugaven com Hauser o Draymond. Jamal Murray, Vucevic, Quickley, Bane i Jabari formen un cinc molt seriós, amb Robert Williams III sortint de la banqueta... quan estigui sa. Ha hipotecat el 2027 i el 2028, així que és ara o mai. Vucevic té 36 anys i a Orlando necessiten tir com l'aigua. Entra als playoffs amb comoditat."},"IND":{"tag":"Play-in","move":"Arriben Myles Turner i Aaron Nesmith; marxa una primera del 2027","key":"Kon Knueppel","watch":"Oso Ighodaro","text":"Indiana ha venut una primera del 2027 per Myles Turner i Aaron Nesmith, una aposta pel present d'un equip que va fer 26-32. Kon Knueppel va pel segon any i és la gran esperança, Keegan Murray i LaVine aporten punts i Turner rebots i taps, però no hi ha ningú per sobre dels 20 FPPG. Equip de molts jugadors de 13 o 15 punts. Ull a Oso Ighodaro, que pot ser titular a Phoenix amb Mark Williams lesionat. Pot competir pel play-in, però costa veure'l a dalt."},"MIL":{"tag":"Reconstrucció","move":"Arriba Austin Reaves; marxen Coby White i Luke Kornet","key":"Stephen Curry","watch":"Morez Johnson Jr.","text":"Steph Curry té 38 anys i cobra 62,6 milions aquesta temporada: és el contracte més car de la lliga i també el seu últim any. Austin Reaves dona una segona arma de 20 FPPG, però darrere hi ha poc: Tre Jones, Filipowski i jugadors de rotació. Després del 18-40 de l'any passat el pla és clar: aguantar aquest curs i alliberar l'espai de Curry el 2027-28, amb set negociadors a la butxaca per a aquell estiu. Morez Johnson Jr., rookie a Dallas, pot tenir minuts aviat."},"ATL":{"tag":"Playoffs","move":"Cap moviment a l'estiu","key":"Nikola Jokic","watch":"Tobias Harris","text":"Tenir Nikola Jokic és començar cada partit amb 37 punts de fantasy a la butxaca. El serbi és el millor jugador de la lliga, i de lluny. La resta de la plantilla, però, és prima: Mikal Bridges, Tobias Harris, que ara juga a San Antonio, i molts jugadors de complement. A més, Moses Moody es va trencar el tendó rotulià al març i a finals de setembre encara només feia treball lleuger a pista. Amb Jokic tot és possible, però per discutir amb Chicago o Orlando cal un segon jugador fiable. El manager es diu Overrated_tatum i té el MVP a casa: res a dir."},"CHA":{"tag":"Playoffs","move":"Cap moviment a l'estiu","key":"James Harden","watch":"Collin Murray-Boyles","text":"Harden, Dyson Daniels i Franz Wagner: tres jugadors de bon nivell i algun risc. James Harden té 37 anys, però Cleveland li ha renovat per tres temporades i 97 milions, i al costat de Donovan Mitchell continuarà tenint molta pilota: 22,6 FPPG l'any passat i res fa pensar que baixi gaire. El dubte és Franz Wagner: ell i Banchero només van coincidir 24 partits l'any passat a Orlando, i això diu molt de la seva salut. Dyson Daniels és un lladre de pilotes de primer nivell, Tari Eason té contracte fins al 2031 i Murray-Boyles creix. Si Franz juga 65 partits, Charlotte és equip de playoffs."},"MIA":{"tag":"Candidat","move":"Marxa Quickley; arriben Asa Newell, una primera del 2028 i un negociador","key":"Shai Gilgeous-Alexander","watch":"Isaiah Collier","text":"Subcampió i amb un dels millors jugadors de la lliga en estat de gràcia. Shai Gilgeous-Alexander és garantia de 27 o 28 FPPG cada nit, i si l'any passat ja va arribar a la final, aquest any no té motius per baixar. La gran notícia és Jalen Williams: només va jugar 33 partits per problemes al isquiotibial, però arriba al camp completament recuperat. L'Eloy ha venut Quickley per Asa Newell, una primera i un negociador: mirant al futur sense deixar de competir. Naz Reid, ara a Charlotte, Collier i Coulibaly completen una plantilla llarga. Torna a ser candidat a la final de l'Est."},"ORL":{"tag":"Candidat","move":"Cap moviment a l'estiu","key":"Luka Doncic","watch":"Ty Jerome","text":"Dos anells en sis anys i Luka Doncic, el segon jugador més productiu de la lliga (31 FPPG). Amb Towns, Ty Jerome, Josh Hart i Hartenstein, el cinc titular és dels millors de la lliga. El problema és el que hi ha darrere: només deu jugadors a la web i una banqueta que tremola quan arriben les lesions. Towns, a més, ha reconegut que veu difícil una extensió amb els Knicks abans de la temporada, i això sempre fa soroll. En Lluís sap guanyar finals: mai el doneu per mort."},"WAS":{"tag":"Playoffs","move":"Cap moviment a l'estiu","key":"Giannis Antetokounmpo","watch":"Cason Wallace","text":"Giannis se'n va a Miami i això, en fantasy, té dues cares: tindrà Bam al costat i menys tirs que a Milwaukee, però també un sistema que el cuidarà. Josh Giddey és un dels bases més complets de la lliga (23,5 FPPG) i entra al camp sense restriccions. PJ Washington i Wiggins donen solidesa, Nurkic aporta rebots i Cason Wallace pot tenir més minuts a Oklahoma. Va fer 32-26 i, amb la mateixa base i Giannis sa, pot millorar."},"DEN":{"tag":"Reconstrucció","move":"Arriba Kentavious Caldwell-Pope; marxa Fred VanVleet","key":"Anthony Edwards","watch":"Khaman Maluach","text":"4-54 l'any passat i 45,3 punts de mitjana, la pitjor xifra de la lliga amb molta diferència. Però vigileu: Tyrese Haliburton torna després de 14 mesos sense jugar i entra al camp sense limitacions, i Anthony Edwards segueix sent Anthony Edwards. Zubac fa números a Indiana, Keaton Wagler (número 5 del draft, als Clippers) i Karim Lopez sumen talent, i Khaman Maluach pot ser titular a Phoenix: Mark Williams s'ha operat l'espatlla i estarà diversos mesos de baixa. No guanyarà l'anell, però el seu salt pot ser dels grans de la temporada."},"MIN":{"tag":"Play-in","move":"Cap moviment a l'estiu","key":"Cade Cunningham","watch":"Nolan Traore","text":"Cade Cunningham és un dels cinc millors jugadors de la lliga i Jaren Jackson Jr. aporta taps i punts, però la plantilla té data de caducitat: LeBron James té 41 anys, artritis al peu i l'esquena vigilada després de perdre's el primer mes de la temporada passada. A Philly, a més, haurà de compartir pilota amb Maxey, Brown i Embiid. Dereck Lively encara no té l'alta per començar el curs. Si LeBron juga 60 partits i Lively torna aviat, playoffs. Si no, play-in."},"OKC":{"tag":"Reconstrucció","move":"Venuts Duren, Jabari Smith Jr. i Jalen Green per rondes, Caruso i Shamet","key":"Evan Mobley","watch":"Bennett Stirtz","text":"L'Aleix ha passat l'estiu venent: Jalen Duren a Boston, Jabari Smith Jr. a Detroit i Jalen Green a Utah. A canvi, tres primeres i tres segones del 2027 i 2028 i peces de rotació com Caruso o Shamet. Mobley i Holmgren són una parella interior d'elit i Nembhard aporta direcció, tot i que amb Haliburton de tornada a Indiana els seus números baixaran. Equip pensat per al 2028, però amb dos pivots com aquests no serà fàcil guanyar-los."},"POR":{"tag":"Play-in","move":"Cap moviment a l'estiu","key":"Trae Young","watch":"Cameron Boozer","text":"Zach Edey, Jarrett Allen, Trae Young i RJ Barrett: sobre el paper, un equip que no hauria d'haver fet un 13-45. Edey només va jugar 11 partits i va passar pel quiròfan, però a finals de setembre ja tenia l'alta per treballar a ritme complet; sa, és dels pivots més productius de la lliga. Trae comparteix vestidor amb Anthony Davis i AJ Dybantsa a Washington, i Mathurin canvia d'aires a New Orleans. Cameron Boozer, número 3 del draft, hauria de tenir minuts des del primer dia a Memphis. Amb salut, pot sumar quinze victòries més."},"UTA":{"tag":"Reconstrucció","move":"Arriben Jalen Green i Draymond Green","key":"OG Anunoby","watch":"Ace Bailey","text":"Utah ve d'un 4-54 i aquest estiu ha anat a buscar Jalen Green i Draymond Green, que junts sumen més faltes tècniques que punts de fantasy. OG Anunoby i Shaedon Sharpe són la base, i Ace Bailey és el jugador a seguir: va passar de 26 a 30 minuts per partit després de l'All-Star i pot ser titular. Mikel Brown Jr., número 6 del draft, tindrà minuts en uns Nets plens de joves. Pujarà, segur, però costa veure-hi més de 25 victòries."},"GSW":{"tag":"Play-in","move":"Arriba Jonathan Kuminga; marxen Aaron Gordon i una primera del 2027","key":"Joel Embiid","watch":"Jeremiah Fears","text":"Joel Embiid ha fet la pretemporada amb el pes de rookie i diu que l'estiu ha estat d'entrenar, no de recuperar-se. Si és veritat, Golden State té un top-10 de la lliga. Però Brandon Ingram, ara als Clippers, s'ha operat d'un trencament parcial de l'Aquil·les i es perdrà l'inici de temporada, i la segona espasa queda en mans de Poeltl i Kuminga, que pot jugar de pivot a Minnesota. En Sergi ha donat Gordon i una primera per Kuminga: aposta per la joventut. Tot depèn dels genolls d'Embiid, com cada any."},"LAC":{"tag":"Play-in","move":"Marxa Julian Champagnie; arriben Sion James i dos negociadors","key":"Anthony Davis","watch":"Aday Mara","text":"Anthony Davis, quan juga, és un top-15 de la lliga (24,5 FPPG). El problema és el quan juga: la temporada passada va estar plena de lesions i ara a Washington conviu amb Sarr i Dybantsa. Okongwu és un pivot fiable, Dejounte Murray i Miles Bridges donen volum i el veterà DeMar DeRozan fa el salt a Denver. Plantilla equilibrada que pot sorprendre si AD respecta el calendari. Els Clippers ja van ser la gran sorpresa dels últims playoffs."},"LAL":{"tag":"Reconstrucció","move":"Devin Booker marxa a Sacramento per Norman Powell, Kennedy Chandler i negociadors","key":"Michael Porter Jr.","watch":"Caleb Wilson","text":"En David ha venut Devin Booker a Sacramento a canvi de Norman Powell, Kennedy Chandler i un grapat de negociadors. Moviment de futur per un equip que va fer 17-41. Michael Porter Jr. és el millor jugador de la plantilla i Powell tindrà tots els tirs que vulgui en uns Bulls en reconstrucció. La mala notícia és Mark Williams: operat del labrum de l'espatlla al setembre, estarà diversos mesos de baixa a Phoenix. Caleb Wilson, número 4 del draft, és el projecte. Any de transició."},"PHO":{"tag":"Playoffs","move":"Cap moviment a l'estiu","key":"Alperen Sengun","watch":"Mitchell Robinson","text":"Sengun és l'estrella (24,1 FPPG) i Zion Williamson, quan està sa, és dels jugadors més difícils d'aturar. Saddiq Bey va sumar 17 FPPG la temporada passada i McDaniels pot jugar minuts de pivot a Minnesota. La gran notícia és Mitchell Robinson, que ha deixat els Knicks campions per signar tres anys amb Boston i hi pot ser titular. Mouhamed Gueye es va operar d'una fractura al peu al juliol i es perdrà l'inici. Plantilla llarga i sense moviments: la continuïtat també és un pla. Playoffs, i compte a primera ronda."},"SAC":{"tag":"Candidat","move":"Arriba Devin Booker; arriben Walter Clayton Jr., Goga Bitadze i una primera del 2027","key":"Devin Booker","watch":"Kyshawn George","text":"Si hi ha un manager que ha guanyat l'estiu, és en Pol. Ha afegit Devin Booker a una plantilla que ja va fer 46-12, ha recuperat una primera d'Indiana i ha acumulat negociadors com si fossin cromos. LaMelo Ball aterra a Minnesota al costat d'Anthony Edwards, Brandon Miller ha passat pel quiròfan de l'espatlla però arriba al camp i Kyshawn George no para de créixer. L'única mala notícia és Henri Veesaar, que es perdrà tota la temporada per un trencament del lligament creuat, però hi ha banqueta de sobres. Candidat seriós a l'anell."},"DAL":{"tag":"Playoffs","move":"Arriba John Collins; marxa Leonard Miller","key":"Walker Kessler","watch":"Cameron Carr","text":"Plantilla llarga i jove, però amb un problema de convivència: Fox, Castle i Vassell juguen tots tres a San Antonio, al costat de Wembanyama i Dylan Harper, i no hi ha pilotes per a tothom. Walker Kessler (22,5 FPPG) és el millor jugador de l'equip, però la temporada passada només va jugar cinc partits per una lesió al labrum de l'espatlla i ara estrena equip als Lakers. John Collins arriba per posar punts i rebots. Julian Reese va fer 17,3 FPPG en 13 partits i ha signat un contracte two-way amb New Orleans: haurà de guanyar-se els minuts. Equip de playoffs; per anar més enllà, cal que Kessler aguanti sa."},"HOU":{"tag":"Candidat","move":"Cap moviment a l'estiu","key":"Amen Thompson","watch":"Cooper Flagg","text":"El millor equip de la fase regular (49-9 i 139,8 de mitjana) i el gran fracàs dels playoffs: 0-3 contra uns Clippers vuitens. La plantilla és la mateixa, però el context canvia. Jaylen Brown passa a Philadelphia, on compartirà pilota amb LeBron, Embiid i Maxey. En canvi, Amen Thompson tindrà més la pilota a Houston amb VanVleet lesionat, Cooper Flagg va pel segon any i Clingan s'ha consolidat a Portland. Candidat clar, però al març ja no impressiona ningú: s'ha de demostrar a l'abril."},"MEM":{"tag":"Candidat","move":"Cap moviment a l'estiu","key":"Donovan Mitchell","watch":"Julius Randle","text":"Campions! Memphis va guanyar l'anell des del quart lloc de l'Oest i a més es va endur la porra. Donovan Mitchell (23,9) i Deni Avdija (22,7) són la parella, i Julius Randle arriba a Brooklyn amb molts tirs a l'abast. Tyler Herro passa a Milwaukee, on serà la primera opció ofensiva. Mitchell té contracte fins al 2031 i en Xavi no ha tocat res: si funciona, no ho toquis. Repetir costarà amb Sacramento i San Antonio armats fins a les dents, però el campió té l'ADN."},"NOP":{"tag":"Reconstrucció","move":"Arriben Fred VanVleet (lesionat) i Sam Hauser; marxen Caldwell-Pope i Walter Clayton Jr.","key":"Alex Sarr","watch":"Darryn Peterson","text":"Estiu complicat. Alex Sarr és titular a Washington al costat d'Anthony Davis i serà el millor jugador de l'equip. Ja Morant canvia Memphis per Portland, on haurà de lluitar per minuts amb Lillard, Holiday i Henderson. Porzingis està de baixa indefinida per un problema de salut, i Fred VanVleet, que ha arribat aquest estiu, es recupera del lligament creuat. Darryn Peterson, número 2 del draft, és la gran notícia: tindrà la pilota a Utah des del primer dia. Any per acumular talent i esperar."},"SAS":{"tag":"Candidat","move":"Arriba Johnny Furphy (traspàs a tres bandes de negociadors)","key":"Victor Wembanyama","watch":"Cedric Coward","text":"Victor Wembanyama (29,3 FPPG) i Jalen Johnson (27,7) són dos jugadors de top-5, i Sabonis aporta el que sempre aporta. Si hi sumes Buzelis, Coward i Ausar Thompson, tens la plantilla més completa de la lliga. Wemby cobra 16,9 milions aquest any: el millor contracte de BALLDONTLIE, i el que fa possible tot plegat. En Javi ha passat un estiu tranquil, amb només un petit traspàs. És el meu favorit per guanyar l'anell, i no m'amagaré si al maig m'equivoco."}},"series":"early","issue":"Previa 2026-27"},{"id":"extra-01","series":"extra","issue":"Entrega 1 · Xavi","kicker":"Extra Possession","date":"27 d'octubre de 2026","title":"El campió que també fa d'àrbitre","pop":"Nova secció a The Bués Corner: Extra Possession, el qüestionari de 24 preguntes d'una paraula per conèixer els mànagers. Obre Xavi, de Memphis.","intro":["Extra Possession és la secció nova de The Bués Corner: 24 preguntes, una paraula per resposta, cap filtre i cap marxa enrere. Com la possessió extra del bàsquet, no estava al guió, però algú acaba pagant-ho igualment.","Obre foc Xavi, mànager de Memphis des de la primera temporada, Administrador del joc i bicampió (2020-21 i 2025-26). És a dir: qui té el botó de la lliga ha estat també el primer a respondre el qüestionari. Res a objectar.","Una advertència. El formulari deia «una paraula». Només 12 de les 24 respostes ho són; la més llarga en té set. L'Administrador, que vetlla perquè es compleixin les normes, és el primer a saltar-se'n una. Ho deixem estar, pel bé de la pau social."],"profile":{"ab":"MEM","name":"Xavi","nick":"Tellis Frank","role":"Mànager de Memphis · Administrador del joc","stats":[["Anys a la lliga","7 (tots)"],["Títols","2 · 2020-21 i 2025-26"],["Fase regular 2025-26","43-15"],["Objectiu declarat","Títol"],["Nota com a mànager","9 sobre 10"],["Respostes d'una paraula","12 de 24"]]},"blocks":[{"title":"Bloc 1 · Personal","items":[{"q":"Professió?","a":"Funcionari interí","c":"Funcionari i interí, i alhora Administrador de la lliga: l'únic càrrec on la interinitat sembla vitalícia."},{"q":"L'app que et roba la vida?","a":"Chess","c":"Dos anells i el que li xucla les hores és l'escacs. Mou peça a l'app i a la lliga."},{"q":"Idol de la teva adolescència?","a":"Epi","c":"Només un nom. Sense cognom, sense context i sense peu de foto. El comitè demana aclariments."},{"q":"BSO de la teva vida?","a":"Diamante Negro","c":"No ens diu si és una cançó o una forma de vida, però sona a títol de pel·lícula que acaba amb anell."},{"q":"El teu rol al grup de WhatsApp?","a":"Àrbitre","c":"Administrador del joc i àrbitre del grup. Qui vigila el que vigila? Ningú, perquè és ell."},{"q":"Quin jugador de la NBA series?","a":"Deni Avdija","ab":["MEM"],"c":"Avdija és el segon jugador amb més fppg de la seva pròpia plantilla (22,7), només per darrere de Donovan Mitchell (23,9). Es veu com el segon violí que acaba dirigint l'orquestra."},{"q":"Quin rol tindries de debò en una plantilla?","a":"Glue guy","c":"Humilitat de campió: es presenta com el que fa pinya, no com l'estrella. Amb dos anells, el marcador ja diu qui és l'estrella."},{"q":"Start, Sub or Sit: Jordan, Kobe, LeBron?","a":"Jordan, LeBron, Kobe","c":"Jordan titular, LeBron de sisè home i Kobe directament al banc. Els fans de Kobe ja poden escriure al grup."}]},{"title":"Bloc 2 · El teu equip","items":[{"q":"Anys a la lliga?","a":"7","ab":["MEM"],"c":"Set anys, tots. Va arribar el primer dia i encara hi és, com part del mobiliari."},{"q":"El teu equip en una paraula?","a":"Guanyador","ab":["MEM"],"c":"Dos títols en set temporades li donen dret a l'adjectiu. A la resta ens queda el substantiu: aspirants."},{"q":"Objectiu d'aquest any?","a":"Títol","c":"Tres opcions i va triar la més cara. Ho diu el campió vigent, que a més va començar 2-0."},{"q":"El teu millor fitxatge/traspàs?","a":"Tyler Herro","ab":["MEM","IND"],"c":"L'estiu 22-23 va portar Herro des d'Indiana a canvi de Zach Collins i la 1a ronda de 2022 de Memphis. Quatre anys després segueix a la plantilla, amb 19,0 de fppg."},{"q":"El teu millor i pitjor pick de draft?","a":"Santi Aldama i Rocco Zikarsky","ab":["MEM"],"c":"Aldama, número 20 del draft de 2021, és el millor. Zikarsky, número 54 de 2025, el pitjor. El detall: avui Zikarsky (5,6 de fppg) rendeix una mica més que Carter Bryant (5,3), pick de primera ronda, el número 24 de 2025. Algú hauria de revisar l'auditoria."},{"q":"Estàs entre els 5 de la lliga que més hores li foten al joc?","a":"Sí","c":"Una de les poques respostes d'una paraula, i de les que se li poden creure: l'Administrador té les claus."},{"q":"Quina norma de la lliga canviaries?","a":"+5 extra quan jugues com a local","c":"Sis paraules en un formulari d'una paraula, i una proposta amb ADN d'Administrador: més marcador per a qui juga a casa. Les propostes, al grup, com sempre."},{"q":"Quina nota et poses com a mànager?","a":"9","c":"Un 9. El deu es reserva per quan en tingui tres."}]},{"title":"Bloc 3 · La resta de mànagers","items":[{"q":"Qui no recorda el password del joc?","a":"Duaso","ab":["UTA"],"c":"Una sola paraula i cap ambigüitat. L'Administrador té la llista de recuperacions de contrasenya i, es veu, també la llista negra."},{"q":"T'aixeques al lavabo a les 4am: obres la web per veure com van els teus jugadors?","a":"No","c":"Un no net. Hores de funcionari: entre els cinc que més hi dediquen, però de 9 a 5. El torn de nit li correspon a un altre."},{"q":"A qui et trobes sempre connectat (a les 4am)?","a":"Elio","ab":["CHI"],"c":"Elio, de Chicago, que va fer 46-12 l'any passat. Es veu que els rècords es fan de matinada. Memphis i Chicago es veuen les cares al Game 3."},{"q":"Team Dore (Detroit) o Edgar (Atlanta)?","a":"Dore","ab":["DET"],"c":"Triar entre dos equips que van 0-2 és com triar entre dos paraigües foradats. Es queda amb Dore."},{"q":"A qui t'agrada més humiliar sobre la pista?","a":"Dore","ab":["DET"],"c":"Dore, un altre cop. Dues respostes seguides al mateix nom i dues emocions ben diferents. L'amor i l'odi sovint tenen la mateixa adreça."},{"q":"Tremoles quan reps un intent de traspàs de...?","a":"Pol","ab":["SAC"],"c":"Pol, de Sacramento: segon de l'Oest l'any passat i fora a primera ronda contra Oklahoma (2-3). Quan el seu nom apareix a la safata d'entrada, algú es posa nerviós."},{"q":"Premi Cicuta Mix?","a":"Jordi","ab":["PHI"],"c":"Premi Cicuta Mix per a Jordi, sense dossier ni acta del jurat. El que no s'explica és el que més fa mal."},{"q":"La teva vida depèn d'un trade: a qui obres? I a qui no?","a":"Obro a Carles, tanco a Javi","ab":["BOS","SAS"],"c":"Obre la porta a Carles (Boston) i la tanca a Javi (San Antonio), el mateix a qui va tombar 3-2 a la final de l'Oest i que també va fer 43-15 l'any passat. Les enemistats neixen als playoffs."}]}],"verdict":["Un funcionari interí amb vocació de campió: arbitra el WhatsApp, juga a escacs, no es lleva a les 4 de la matinada i només té por d'una cosa, un traspàs de Pol. Les respostes dibuixen un mànager ordenat i segur de si mateix, amb un 9 de nota i una forma de fer que s'assembla molt a la de qui té l'anell al calaix.","Amb Dore, en canvi, la relació és d'amor i odi en tres preguntes: el tria entre Edgar i ell, i també a qui més li agradaria humiliar. Dore ja pot anar escalfant."],"next":"Extra Possession continuarà amb la resta de mànagers a mesura que arribin les respostes. Si encara no has contestat, el formulari continua obert.","form":"https://docs.google.com/forms/d/e/1FAIpQLSfHDP0TpuisbXhc3O7HUcc2Jx-FnfE4LirOykvov4xIuOQXHA/viewform"},{"id":"extra-02","series":"extra","issue":"Entrega 2 · Valen","kicker":"Extra Possession","date":"28 d'octubre de 2026","title":"Els Burratxus tenen valors","pop":"Extra Possession, entrega 2: Valen, de Los Angeles Clippers, respon les 24 preguntes. Hi ha Tinder, Morat amb «t» i un sorteig de franquícies.","intro":["Segona entrega d'Extra Possession, el qüestionari de 24 preguntes d'una paraula. Després de l'Administrador, li toca a Valen, mànager dels Clippers des de la primera temporada i, segons el formulari, tricampió del món.","A la vitrina de la lliga, però, els Clippers tenen zero títols. Deu ser un campionat d'una altra categoria i que no puntua aquí. Ho respectem, sobretot perquè la resta de respostes són massa bones per perdre-s'ho.","Valen es defineix com a «memer» al grup de WhatsApp. Qui el segueix al grup sap que, si no n'hi hagués cap, algú l'hauria hagut d'inventar."],"profile":{"ab":"LAC","name":"Valen","nick":"Valengiio","role":"Mànager de Los Angeles Clippers · Memer oficial del grup","stats":[["Anys a la lliga","7 (tots)"],["Títols a la lliga","0 (al món, 3)"],["Fase regular 2025-26","27-31 · 8è de l'Oest"],["Playoffs 2025-26","3-0 a HOU · 0-3 vs MEM"],["Objectiu declarat","Playoffs"],["Nota com a mànager","6 (8 si parla amb Javi)"],["Millor jugador de la plantilla","Anthony Davis · 24,5 fppg"]]},"blocks":[{"title":"Bloc 1 · Personal","items":[{"q":"Professió?","a":"Tricampió del món","c":"La lliga només en reconeix zero, així que els tres títols deuen ser de l'altra lliga: la d'ell."},{"q":"L'app que et roba la vida?","a":"Tinder","c":"Una app, una resposta i cap comentari. Aquesta vegada el comitè de redacció s'abstén."},{"q":"Idol de la teva adolescència?","a":"Mario Casas","c":"Ni un base ni un pivot: un galant. Qui tingui por del draft ja sap on no acabarà."},{"q":"BSO de la teva vida?","a":"Morat, amb «t», no amb «d»","c":"Una resposta d'una paraula amb correcció ortogràfica inclosa. Pot ser que la lletra de la cançó li importi menys que el nom del grup."},{"q":"El teu rol al grup de WhatsApp?","a":"Memer","c":"Autodefinició perfecta. La resta del grup només pot afegir-hi emojis."},{"q":"Quin jugador de la NBA series?","a":"Boris Diaw (pel cul)","c":"El parèntesi és d'ell, no nostre, i no el traduirem. Només diem que és l'única resposta del bloc que ve amb comentari de fàbrica."},{"q":"Quin rol tindries de debò en una plantilla?","a":"Estrella","c":"Un 27-31 l'any passat i es veu estrella. La confiança és l'únic actiu que no té límit de salary cap."},{"q":"Start, Sub or Sit: Jordan, Kobe, LeBron?","a":"Mato a Kobe, follo Jordan, caso LeBron","c":"Valen ha ignorat el format i ha jugat a un altre joc. Els advocats de Kobe, Jordan i LeBron ja han rebut la còpia del formulari."}]},{"title":"Bloc 2 · El teu equip","items":[{"q":"Anys a la lliga?","a":"7","ab":["LAC"],"c":"Set temporades, cap títol. Constància no els en falta."},{"q":"El teu equip en una paraula?","a":"Burratxus","ab":["LAC"],"c":"Una sola paraula i cap explicació. És el nom d'equip que ve amb més identitat de tota la lliga, i no cal que ningú l'expliqui."},{"q":"Objectiu d'aquest any?","a":"Playoffs","ab":["LAC"],"c":"Realista: l'any passat va entrar com a vuitè i va fer fora el número u de l'Oest. Els playoffs són el seu hàbitat."},{"q":"El teu millor fitxatge/traspàs?","a":"Okongwu","ab":["LAC"],"c":"Okongwu fa 19,1 de fppg i és el segon de la plantilla, només per darrere d'Anthony Davis (24,5). A l'historial de traspassos no hi ha rastre d'aquesta operació, o sigui que o l'ha fitxat net o algú ens ha d'explicar la jugada."},{"q":"El teu millor i pitjor pick de draft?","a":"Nikola Topic, els dos alhora","ab":["LAC"],"c":"Topic va ser el número 20 del draft de 2024 i aquesta temporada fa 6,7 de fppg. L'única persona al món que pot ser el seu millor i el seu pitjor pick és la que només n'ha triat un."},{"q":"Estàs entre els 5 de la lliga que més hores li foten al joc?","a":"No","c":"Un no net. De fet, l'hora a la qual ell és a la web depèn d'on hagi sopat."},{"q":"Quina norma de la lliga canviaries?","a":"Cada x anys faria un sorteig de les franquícies","c":"La proposta més revolucionària del formulari, i també la més interessada: la fa un mànager amb zero títols. Els que en tenen, com Xavi i Memphis, ja es poden posar a escriure al grup."},{"q":"Quina nota et poses com a mànager?","a":"6, si parlo amb Javi, un 8","c":"Un 6 per al mànager i un 8 si hi intervé Javi. Javi (San Antonio) fa pujar la nota dos punts, de franc. Cap agent ho fa tan bé."}]},{"title":"Bloc 3 · La resta de mànagers","items":[{"q":"Qui no recorda el password del joc?","a":"Jo","c":"Autoinculpació sense pressió del jurat. És l'única resposta de tot el formulari que ningú podrà desmentir."},{"q":"T'aixeques al lavabo a les 4am: obres la web per veure com van els teus jugadors?","a":"No m'aixeco, torno de Mas Sorrer","c":"A les 4 de la matinada no mira la web: hi arriba. L'aclariment ajuda a entendre la resposta següent."},{"q":"A qui et trobes sempre connectat (a les 4am)?","a":"Incapaç de llegir en les condicions que vaig","c":"No ha contestat la pregunta, però sí la d'abans. Cap nom, cap pista: el comitè arxiva l'expedient per falta de proves i de lucidesa."},{"q":"Team Dore (Detroit) o Edgar (Atlanta)?","a":"Dore","ab":["DET"],"c":"Tercera resposta, tercer vot per Dore. Fins ara, els tres que han respost han triat el mateix."},{"q":"A qui t'agrada més humiliar sobre la pista?","a":"A Clippers tenim valors… no fem això","ab":["LAC"],"c":"El pacifisme ve de l'equip que va fer fora el número u (3-0 a Houston) i que va ser escombrat 0-3 per Memphis a la ronda següent. Els valors són el que queda quan s'acaba la sèrie."},{"q":"Tremoles quan reps un intent de traspàs de...?","a":"Sir_polux…","ab":["SAC"],"c":"Sir_polux és el nom de Pol, de Sacramento. Els tres punts suspensius són més elocuents que qualsevol nom."},{"q":"Premi Cicuta Mix?","a":"A Carles, per ser de l'Espanyol","ab":["BOS"],"c":"El premi va per a Carles (Boston) per un motiu que no té res a veure amb el bàsquet. A la lliga de l'ofensa gratuïta, aquest jurat vota amb el cor."},{"q":"La teva vida depèn d'un trade: a qui obres? I a qui no?","a":"Obro a Javi, no obro a Aleix","ab":["SAS","OKC"],"c":"Obre la porta a Javi (San Antonio), el seu assessor de nota, i la tanca a Aleix (Oklahoma City). Una decisió que Aleix no oblidarà fàcilment."}]}],"verdict":["Valen és el mànager que tothom voldria tenir al grup de WhatsApp i que ningú voldria tenir a l'altra banda d'un traspàs: memer declarat, estrella per ambició, pacifista per convicció i sense títols per estadística. Tot plegat amb un Anthony Davis a 24,5 de fppg i un Okongwu que ja ha entrat a la categoria de «millor fitxatge» per aclamació d'ell mateix.","I una resposta que li fa justícia: «Jo», quan li van preguntar qui no recorda el password del joc."],"next":"Extra Possession continua amb la resta de mànagers a mesura que arriben les respostes. Si encara no has contestat, el formulari continua obert.","form":"https://docs.google.com/forms/d/e/1FAIpQLSfHDP0TpuisbXhc3O7HUcc2Jx-FnfE4LirOykvov4xIuOQXHA/viewform"},{"id":"extra-03","series":"extra","issue":"Entrega 3 · Pino","kicker":"Extra Possession","date":"29 d'octubre de 2026","title":"Neutre, reivindicatiu i bicampió","pop":"Extra Possession, entrega 3: Pino, d'Orlando, respon les 24 preguntes. Un 7 de nota, un «SIIIIII» a les 4am i un jugador retirat.","intro":["Tercera entrega d'Extra Possession. Avui, Pino, mànager d'Orlando (Lluís per al registre de la lliga, Pino per als amics) i bicampió de la BALLDONTLIE amb els títols de 2023-24 i 2024-25.","Es defineix com a «difusor de coneixements», un títol que sona molt millor que el de la seva app preferida: ChatGPT. Cadascú es guanya la vida com pot, i alguns ho deleguen.","Una nota de context: el formulari demanava una paraula per resposta. Pino n'ha entregat de tota mena, des d'un «SIIIIII» de cinc vocals fins a una cançó de Bruce Springsteen."],"profile":{"ab":"ORL","name":"Pino","nick":"Latin1323","role":"Mànager d'Orlando · Difusor de coneixements","stats":[["Anys a la lliga","5"],["Títols","2 · 2023-24 i 2024-25"],["Fase regular 2025-26","37-21"],["Playoffs 2025-26","0-3 contra Brooklyn (3r contra 6è)"],["Objectiu declarat","Títol, «SEMPRE»"],["Nota com a mànager","7 sobre 10"],["Millor jugador de la plantilla","Luka Doncic · 31,0 fppg"]]},"blocks":[{"title":"Bloc 1 · Personal","items":[{"q":"Professió?","a":"Difusor de coneixements","c":"Ho diu amb la serietat d'un congrés. Mentre algú difon, la resta de la lliga s'ho mira des de la graderia."},{"q":"L'app que et roba la vida?","a":"ChatGPT","c":"Cap sorpresa per a un difusor de coneixements: l'app que li roba la vida és la que li serveix el coneixement."},{"q":"Idol de la teva adolescència?","a":"Sarunas Jasikevicius","c":"El nom complet, sense abreviar i amb tots els sons. Aquí no hi ha cap «Epi»."},{"q":"BSO de la teva vida?","a":"Streets of Philadelphia, Bruce Springsteen","c":"Una cançó sobre Filadèlfia triada per un mànager d'Orlando. Jordi, de Philadelphia, ja pot prendre nota."},{"q":"El teu rol al grup de WhatsApp?","a":"Bastant neutre / reivindicatiu","c":"Dues paraules que no s'entenen entre si. Neutre i reivindicatiu: algú que es queixa sense prendre partit."},{"q":"Quin jugador de la NBA series?","a":"Marcus Smart","c":"Smart no és a la plantilla d'Orlando, que avui gira entorn de Doncic, Towns i Hart. L'esperit, en canvi, sí."},{"q":"Quin rol tindries de debò en una plantilla?","a":"Glue guy","c":"Igual que Xavi. Tenim dos glue guys i, de moment, cap estrella declarada: Valen, però, ja s'ha apuntat."},{"q":"Start, Sub or Sit: Jordan, Kobe, LeBron?","a":"LeBron, Jordan, Kobe","c":"LeBron titular, Jordan de sisè home i Kobe al banc. Kobe és el darrer en les tres respostes que tenim (a Valen li ha tocat «matar-lo»). El formulari no ha estat amable amb ell."}]},{"title":"Bloc 2 · El teu equip","items":[{"q":"Anys a la lliga?","a":"5","ab":["ORL"],"c":"Cinc temporades i dos títols: un anell cada dos anys i mig. Bona mitjana."},{"q":"El teu equip en una paraula?","a":"Apurat","ab":["ORL"],"c":"Bicampió i es defineix com a «apurat». Modèstia de campió o poca vergonya, a escollir."},{"q":"Objectiu d'aquest any?","a":"Títol, SEMPRE","ab":["ORL"],"c":"Majúscules incloses. El detall: l'any passat va ser tercer i va caure 0-3 contra el sisè, Brooklyn. Aquest any, el 2-0 inicial ja diu que va amb ganes de revenja."},{"q":"El teu millor fitxatge/traspàs?","a":"Anthony Davis per Keenan Murray i Buddy Hield","ab":["ORL","DEN"],"c":"L'estiu 22-23 va portar Davis des de Denver a canvi de Murray i Hield. Dos estius després el va enviar als Clippers amb Champagnie i una 1a ronda a canvi de Towns. Davis hi fa avui 24,5 de fppg, a la plantilla de Valen."},{"q":"El teu millor i pitjor pick de draft?","a":"No escullo mai al draft, traspasso totes les rondes","c":"No pot fallar el pick qui no el fa. Estratègia sense risc, amb dos anells com a argument."},{"q":"Estàs entre els 5 de la lliga que més hores li foten al joc?","a":"No","c":"Un no, i sense gaire convicció, si tenim en compte la resposta de més avall: a les 4am hi ha algú que s'aixeca."},{"q":"Quina norma de la lliga canviaries?","a":"No demanar dobles posicions, let's play","c":"Més que una norma, una crida a jugar: que s'acabin els tràmits i comenci el partit."},{"q":"Quina nota et poses com a mànager?","a":"7","c":"Un 7, el que et poses quan et saps bo, però no vols que sembli que ho dius tu. Bicampió amb un 7: deu ser dur ser el seu professor."}]},{"title":"Bloc 3 · La resta de mànagers","items":[{"q":"Qui no recorda el password del joc?","a":"IDK","c":"Xavi va assenyalar Duaso (Enric, d'Utah), Valen va dir «jo» i Pino diu «ni idea». Tres respostes diferents per a una sola contrasenya."},{"q":"T'aixeques al lavabo a les 4am: obres la web per veure com van els teus jugadors?","a":"SIIIIII","c":"Cinc «I» de convicció. Contradiu el «No» de la pregunta de les hores, però el cor té raons que el formulari no entén."},{"q":"A qui et trobes sempre connectat (a les 4am)?","a":"Elio","ab":["CHI"],"c":"Elio, per segona vegada. Xavi ja l'havia dit. Elio és, amb dos vots, el mànager més vigilat de la matinada."},{"q":"Team Dore (Detroit) o Edgar (Atlanta)?","a":"Dore","ab":["DET"],"c":"Tercera resposta, tercer vot per Dore. Fins ara, els tres que han respost han triat el mateix."},{"q":"A qui t'agrada més humiliar sobre la pista?","a":"Javi, per proximitat no per altre cosa","ab":["SAS"],"c":"Javi (San Antonio) i la raó, diu ell, és la proximitat. La humiliació, com el pa, es reparteix pel veí."},{"q":"Tremoles quan reps un intent de traspàs de...?","a":"Pol o David","ab":["SAC"],"c":"Pol (Sacramento) o David. A la lliga n'hi ha dos, de David, i els dos tenen motius per preocupar-se."},{"q":"Premi Cicuta Mix?","a":"No entenc aquest llenguatge","c":"El premi que ningú no entén segueix sense explicació. El comitè prepara un glossari."},{"q":"La teva vida depèn d'un trade: a qui obres? I a qui no?","a":"Obriria a Martí; no a Enric, que em va vendre un jugador retirat","ab":["MIL","UTA"],"c":"Obre a Martí (Milwaukee) perquè fa bones ofertes. Tanca a Enric (Utah), que li va vendre un jugador retirat. Utah, per cert, ja surt per segona vegada en tres entregues."}]}],"verdict":["Pino és el bicampió que es posa un 7, es declara «apurat» i diu que el seu objectiu és el títol, SEMPRE. És neutre i reivindicatiu, difon coneixements amb ajuda de ChatGPT, i s'aixeca a les 4am per mirar la web mentre jura que no hi dedica gaires hores.","El seu millor traspàs, Davis, ja no és a la seva plantilla. És, de fet, a la de Valen. Les millors operacions s'envelleixen com el vi: l'aprofita un altre."],"next":"Extra Possession continua amb la resta de mànagers a mesura que arriben les respostes. Si encara no has contestat, el formulari continua obert.","form":"https://docs.google.com/forms/d/e/1FAIpQLSfHDP0TpuisbXhc3O7HUcc2Jx-FnfE4LirOykvov4xIuOQXHA/viewform"}]};

/* ---------- TRASPASSOS ---------- */
function vTraspassos(){
  const seasons=[...new Set(D.trades.map(t=>t.season))];
  const q=state.tq.toLowerCase();
  const list=D.trades.map((t,i)=>({...t,i})).filter(t=>(!state.tSeason||t.season===state.tSeason)&&(!state.tTeam||t.sides.some(s=>s.team===state.tTeam))&&(!q||t.sides.some(s=>s.gives.toLowerCase().includes(q)))).reverse();
  const cnt={}; D.trades.forEach(t=>t.sides.forEach(s=>cnt[s.team]=(cnt[s.team]||0)+1));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const lastS=seasons[seasons.length-1];
  const nofilter=!state.tSeason&&!state.tTeam&&!q;
  const feat=D.trades.map((t,i)=>({...t,i})).filter(t=>t.season===lastS).reverse().slice(0,4);
  const featIds=new Set(feat.map(t=>t.i));
  const card=(t,isNew)=>`<article class="trade${isNew?' new':''}">${t.sides.map(s=>`<div class="sd">${tm(s.team,{big:1,full:1})}<span class="lbl">Envia</span><span class="pk2">${esc(s.gives)}</span></div>`).join('')}<div class="tmeta"><span>${isNew?'<span class="pill own">Nou</span> ':''}${t.season}</span><span>${t.sides.length===3?'Traspàs a tres bandes':''}</span></div></article>`;
  const shown=nofilter?list.filter(t=>!featIds.has(t.i)):list;
  return `<section class="view">
  <div class="head"><div><div class="eyebrow">${D.trades.length} operacions registrades</div><h2>Traspassos</h2><p class="lede">Cada columna mostra el que envia aquella franquícia. Els més recents surten primer.</p></div></div>
  <div class="grid2" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))">
   <div class="panel" style="display:grid;gap:10px"><h3>Filtres</h3>
    <div class="filters"><select id="tSeason"><option value="">Totes les temporades</option>${seasons.map(s=>`<option ${s===state.tSeason?'selected':''}>${s}</option>`).join('')}</select>
    <select id="tTeam"><option value="">Tots els equips</option>${D.teams.map(t=>`<option value="${t.abbr}" ${t.abbr===state.tTeam?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
    <input type="search" id="tq" placeholder="Busca un jugador o una ronda" value="${esc(state.tq)}" style="flex:1"></div>
    <span class="note">${list.length} traspassos</span></div>
   <div class="panel"><h3>Els més actius</h3><div class="rank">${top.map(([a,n])=>`<div class="r">${tm(a,{link:1})}<div class="b"><i class="s" style="width:${n/top[0][1]*100}%"></i></div><span class="num mono">${n}</span></div>`).join('')}</div></div>
  </div>
  ${nofilter?`<div class="latest"><div class="head"><div><div class="eyebrow">${lastS} · ${D.trades.filter(t=>t.season===lastS).length} traspassos</div><h3 style="margin-top:6px">Últims traspassos</h3></div></div>${feat.map(t=>card(t,true)).join('')}</div><h3>Tots els traspassos</h3>`:''}
  <div class="tlist" id="tlist">${shown.map(t=>card(t,t.season===lastS)).join('')||'<p class="empty">Cap traspàs amb aquests filtres.</p>'}</div>
  </section>`;
}

  const c=[...A.contest].sort((x,y)=>(parseInt(x.rank)||99)-(parseInt(y.rank)||99)||(y.pct??-1)-(x.pct??-1));
  return `<section class="view">
  <div class="head"><div><div class="eyebrow">Temporada ${A.season} · ${A.game}</div><h2>All-Star</h2><p class="lede">Est contra Oest amb plantilles de 15 jugadors triades per tres seleccionadors de cada conferència. Compta la valoració que cada jugador aporta segons els minuts assignats.</p></div></div>
  <div class="score"><div class="${eW?'win':''}"><div class="c">Est</div><div class="s num">${A.tot.E.toLocaleString('ca-ES')}</div></div><div class="vs">—</div><div class="${eW?'':'win'}"><div class="c">Oest</div><div class="s num">${A.tot.W.toLocaleString('ca-ES')}</div></div></div>
  <div class="awards"><div class="aw"><span class="eyebrow">MVP</span><span class="v">${esc(A.mvp.name)}</span>${tm(A.mvp.team,{full:1})}</div><div class="aw"><span class="eyebrow">Concurs de triples</span><span class="v">${esc(A.three.name)}</span>${tm(A.three.team,{full:1})}</div>
   <div class="panel"><span class="eyebrow">Seleccionadors</span><p style="margin:8px 0 0;font-size:14px"><b>Est:</b> ${A.sel.E.map(esc).join(', ')}<br><b>Oest:</b> ${A.sel.W.map(esc).join(', ')}</p></div></div>
  <div class="grid2">${ros(A.east,'Plantilla Est')}${ros(A.west,'Plantilla Oest')}</div>
  <div class="grid2">
   <div class="panel"><h3>Concurs de triples</h3><div class="tw"><table><thead><tr><th>Pos.</th><th>Equip</th><th>Jugador</th><th class="n">Triples</th><th class="n">%</th></tr></thead><tbody>${c.map(x=>`<tr><td class="mono">${esc(x.rank||'')}</td><td>${tm(x.team)}</td><td>${esc(x.player)}</td><td class="n mono">${esc(x.made)}</td><td class="n mono">${x.pct==null?'—':Math.round(x.pct*100)+'%'}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="panel"><h3>Normes i recompenses</h3><ul class="rules">
    <li>Plantilles de 15 jugadors, amb un mínim de 2 rookies.</li><li>Minuts disponibles: 200 de G, 200 de F i 100 de C.</li>
    <li>Els seleccionadors són els 3 millors classificats de cada conferència en acabar el Game 20.</li>
    <li>Les plantilles i el participant de triples es tanquen el 22/12 pel grup de WhatsApp.</li>
    <li>MVP: el jugador que més valoració aporta al seu equip segons el percentatge de minuts. Desempat: conferència guanyadora, valoració per minut i sorteig.</li>
    <li>Triples: guanya qui en fa més al Game 30. Desempat pel percentatge del partit i després pels de la temporada.</li>
    <li>MVP i guanyador de triples: 1 negociador extra l'any següent per a la franquícia propietària.</li>
    <li>Conferència guanyadora: 1 € menys d'inscripció la temporada següent. Perdedora: 1 € més. Acumulatiu.</li></ul></div>
  </div>
  </section>`;
}

  <div class="grid2">${confT('E')}${confT('W')}</div>
  <div class="panel"><div class="eyebrow">Crònica · Playoffs 2025-26</div><h3 style="font-size:30px;margin:8px 0 14px">Memphis torna a dalt de tot</h3>
   <div class="prose">
    <p>Els Grizzlies de Xavi van guanyar el seu segon títol, cinc anys després del primer, el 2020-21. Ho van fer des del quart lloc de l'Oest amb un 43-15 a la fase regular i sense factor pista en cap de les tres primeres eliminatòries.</p>
    <p>La sorpresa de la primera ronda va ser a l'Oest: Houston, líder de la lliga amb un 49-9 i la millor mitjana (139,8), va caure 3-0 contra els Clippers, vuitens. Sacramento, segon, també va quedar fora contra Oklahoma City (2-3). Memphis va necessitar el cinquè partit per superar Phoenix i San Antonio es va desfer de Dallas per 3-1.</p>
    <p>A semifinals de conferència Memphis va escombrar els Clippers (3-0) i San Antonio va eliminar Oklahoma (3-1). La final de l'Oest va anar al límit: 3-2 per als Grizzlies.</p>
    <p>A l'Est, Miami va arribar a la final des del quart lloc tombant Atlanta (3-2) i el líder Chicago, que havia fet 46-12, per 3-0. Brooklyn, sisè, va deixar fora Orlando (3-0) i Philadelphia (3-2), però va caure 3-1 a la final de conferència.</p>
    <p>La final no va tenir història: 3-0 per a Memphis. El títol va venir amb premi doble, perquè Memphis també es va endur la porra, l'única que va encertar el campió.</p>
   </div>
   <p class="note" style="margin-top:14px">Les cròniques de la temporada 2026-27 s'afegiran a mesura que es juguin els partits.</p></div>
  </section>`;
